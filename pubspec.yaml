name: nahda_pdf_studio
description: Offline-first Arabic PDF Studio for Flutter Web and Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  pdfrx: 2.12.0
  dart_pdf_editor: 15.0.0
  dart_pdf_editor_assets: 15.0.0
  file_picker: 13.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/

name: Validate Nahda PDF Studio
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/qa/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
      - name: Fetch licensed Arabic font (not stored in repo)
        run: |
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf' -o assets/fonts/Amiri-Regular.ttf
          test "$(wc -c < assets/fonts/Amiri-Regular.ttf)" -gt 100000
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/OFL.txt' -o assets/fonts/Amiri-OFL.txt
      - run: flutter create --platforms=android,web --project-name nahda_pdf_studio --org com.nahda.pdfstudio .
      - name: Remove obsolete Flutter template counter test
        run: |
          if [ -f test/widget_test.dart ] && grep -q 'Counter increments smoke test' test/widget_test.dart && grep -q 'MyApp' test/widget_test.dart; then
            rm test/widget_test.dart
          fi
      - run: flutter pub get
      - run: flutter analyze
      - name: Run Web browser smoke and editor-contract tests
        run: flutter test -d chrome test/workspace_smoke_test.dart test/pdf_engine_interface_test.dart test/page_selection_test.dart test/page_tools_dialog_test.dart test/document_workspace_test.dart
      - name: Build release Web app
        run: flutter build web --release
      - name: Run native PDF Arabic annotation integration (Linux C toolchain)
        run: timeout -s TERM 120s flutter test test/arabic_annotation_integration_test.dart test/page_tools_integration_test.dart test/document_workspace_native_test.dart

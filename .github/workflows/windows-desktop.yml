name: Build and test Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'scripts/build_windows.ps1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: Verify compiler and ATL
        shell: pwsh
        run: |
          flutter doctor -v
          $pattern = 'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\atlmfc\include\atlstr.h'
          $atl = @(Get-Item -Path $pattern -ErrorAction SilentlyContinue)
          if ($atl.Count -eq 0) { throw 'MSVC ATL (atlstr.h) is missing from Windows runner' }
          Write-Host "ATL: $($atl[0].FullName)"
      - name: Download SIL-OFL Amiri font
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets/fonts | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf' -OutFile assets/fonts/Amiri-Regular.ttf
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/OFL.txt' -OutFile assets/fonts/Amiri-OFL.txt
          if ((Get-Item assets/fonts/Amiri-Regular.ttf).Length -lt 100000) { throw 'Incomplete Arabic font' }
      - name: Generate, analyze, test and build Windows
        shell: pwsh
        run: .\scripts\build_windows.ps1 -RunNativeTest -Release
      - uses: actions/upload-artifact@v4
        with:
          name: nahda-pdf-studio-windows-x64
          path: build/windows/x64/runner/Release/
          retention-days: 14
          if-no-files-found: error
